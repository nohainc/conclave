name: conclave_workspace
description: Conclave AX Workspace desktop application and runtime.
publish_to: none
version: 1.0.3

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.0
  archive: ^4.3.0
  conclave_protocol:
    path: ../../packages/dart/protocol
  conclave_worker_protocol:
    path: ../../packages/conclave_worker_protocol
  conclave_tool_profile_v1:
    path: ../../packages/tool_profile_v1
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.25.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/engines/
