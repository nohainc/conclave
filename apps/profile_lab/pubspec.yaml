name: syntila_profile_lab
description: Syntila Profile Lab internal desktop engineering application for Worker Tool Profiles.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.0
  archive: ^4.3.0
  syntila_design:
    path: ../../packages/syntila_design
  syntila_protocol:
    path: ../../packages/dart/protocol
  syntila_worker_protocol:
    path: ../../packages/syntila_worker_protocol
  syntila_tool_profile_v1:
    path: ../../packages/tool_profile_v1
  syntila_cli_worker_runtime:
    path: ../../packages/syntila_cli_worker_runtime
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.25.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/engines/
    - assets/worker_icons/
