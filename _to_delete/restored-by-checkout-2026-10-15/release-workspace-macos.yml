name: Release Syntila Workspace for macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable Workspace release version
        type: string
        required: true
      channel:
        description: Release channel
        type: choice
        options: [development, beta, stable]
        default: development
        required: true
      release_notes:
        description: Release notes included in signed metadata
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require successful repository CI for this main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Workspace releases must be dispatched from main."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/development-guard.yml/runs?head_sha=$GITHUB_SHA&per_page=100" > "$RUNNER_TEMP/ci-runs.json"
          node --input-type=module - "$RUNNER_TEMP/ci-runs.json" <<'NODE'
          import { readFileSync } from 'node:fs';

          const { workflow_runs: runs = [] } = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const passed = runs.some((run) =>
            run.event === 'push' &&
            run.head_branch === 'main' &&
            run.head_sha === process.env.GITHUB_SHA &&
            run.status === 'completed' &&
            run.conclusion === 'success'
          );
          if (!passed) {
            console.error(`No successful repository CI run exists for ${process.env.GITHUB_SHA} on main.`);
            process.exit(1);
          }
          console.log(`Repository CI passed for ${process.env.GITHUB_SHA}.`);
          NODE

  release:
    needs: ci-gate
    runs-on: macos-15
    environment: workspace-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Configure Developer ID and notarization
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.SYNTILA_MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.SYNTILA_MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.SYNTILA_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.SYNTILA_APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.SYNTILA_APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          test -n "$MACOS_CERTIFICATE_P12" && test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$APPLE_ID" && test -n "$APPLE_TEAM_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/syntila-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERT_PATH="$RUNNER_TEMP/syntila-developer-id.p12"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          test -n "$IDENTITY"
          echo "SYNTILA_MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          xcrun notarytool store-credentials syntila-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --keychain "$KEYCHAIN_PATH"
          echo 'SYNTILA_MACOS_NOTARY_PROFILE=syntila-notary' >> "$GITHUB_ENV"
      - name: Run Workspace analysis and tests
        run: bash scripts/test-workspace-macos.sh
      - name: Build, sign, and notarize Workspace
        env:
          SYNTILA_WORKSPACE_VERSION: ${{ inputs.version }}
          SYNTILA_RELEASE_TRUST_KEYS_JSON: ${{ vars.SYNTILA_RELEASE_TRUST_KEYS_JSON }}
        run: bash scripts/build-workspace-macos.sh
      - name: Verify notarized app archive
        env:
          WORKSPACE_VERSION: ${{ inputs.version }}
        run: |
          ARCHIVE="dist/syntila-workspace/macos/Syntila-Workspace-$WORKSPACE_VERSION-macos.zip"
          mkdir -p "$RUNNER_TEMP/workspace-app-check"
          ditto -x -k "$ARCHIVE" "$RUNNER_TEMP/workspace-app-check"
          APP="$RUNNER_TEMP/workspace-app-check/Syntila Workspace.app"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose "$APP"
      - name: Sign, publish, download, and verify immutable metadata
        env:
          WORKSPACE_ARCHIVE: dist/syntila-workspace/macos/Syntila-Workspace-${{ inputs.version }}-macos.zip
          WORKSPACE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          CLOUD_API_URL: ${{ vars.CLOUD_API_URL }}
          RELEASE_PUBLISH_TOKEN: ${{ secrets.SYNTILA_RELEASE_PUBLISH_TOKEN }}
          SYNTILA_WORKSPACE_SIGNING_SEED: ${{ secrets.SYNTILA_WORKSPACE_ED25519_SEED }}
          SYNTILA_WORKSPACE_SIGNING_KEY_ID: ${{ vars.SYNTILA_WORKSPACE_SIGNING_KEY_ID }}
          SYNTILA_RELEASE_TRUST_KEYS_JSON: ${{ vars.SYNTILA_RELEASE_TRUST_KEYS_JSON }}
        run: node scripts/release/publish-workspace-release.mjs
