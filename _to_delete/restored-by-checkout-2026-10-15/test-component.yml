name: Component Validation

on:
  workflow_dispatch:
    inputs:
      component:
        description: "Select component to validate"
        required: true
        type: choice
        options:
          - "AX Web App"
          - "Cloud & TypeScript"
          - "Workspace"
          - "Profile Lab"
          - "Public Site"
          - "Worker Engine"
          - "Repository Static Guard"
          - "All Components"

permissions:
  contents: read

concurrency:
  group: component-validation-${{ github.ref }}-${{ github.event.inputs.component }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate ${{ github.event.inputs.component }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: false
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Selected Component
        run: |
          case "${{ github.event.inputs.component }}" in
            "AX Web App")
              pnpm validate:app
              cd apps/app && flutter build web --release --dart-define=CONCLAVE_API_URL=/api
              ;;
            "Cloud & TypeScript")
              pnpm validate:cloud
              pnpm check:fixture-e2e
              ;;
            "Workspace")
              pnpm validate:workspace
              ;;
            "Profile Lab")
              pnpm validate:profile-lab
              ;;
            "Public Site")
              pnpm validate:site
              ;;
            "Worker Engine")
              pnpm validate:engine
              ;;
            "Repository Static Guard")
              pnpm check:static
              ;;
            "All Components")
              pnpm check:static
              pnpm validate:cloud
              pnpm validate:engine
              pnpm validate:app
              pnpm validate:workspace
              pnpm validate:profile-lab
              pnpm validate:site
              ;;
            *)
              echo "Unknown component: ${{ github.event.inputs.component }}" >&2
              exit 1
              ;;
          esac
