name: Development AX Web App

on:
  push:
    branches: [main]
    paths:
      - "apps/app/**"
      - "packages/conclave_design/**"
      - "packages/dart/protocol/**"
      - "packages/protocol/**"
      - "scripts/check-flutter-app.sh"
      - ".github/workflows/development-app.yml"
  pull_request:
    paths:
      - "apps/app/**"
      - "packages/conclave_design/**"
      - "packages/dart/protocol/**"
      - "packages/protocol/**"
      - "scripts/check-flutter-app.sh"
      - ".github/workflows/development-app.yml"

permissions:
  contents: read

concurrency:
  group: dev-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-app:
    name: Validate AX Web App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: false
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-
      - name: Validate AX Flutter App
        run: bash scripts/check-flutter-app.sh app
      - name: Build Web Client Bundle
        run: flutter build web --release --dart-define=CONCLAVE_API_URL=/api
        working-directory: apps/app
