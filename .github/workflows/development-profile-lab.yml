name: Development Profile Lab

on:
  push:
    branches: [main]
    paths:
      - "apps/profile_lab/**"
      - "packages/conclave_design/**"
      - "packages/dart/protocol/**"
      - "packages/protocol/**"
      - "packages/conclave_worker_protocol/**"
      - "packages/tool_profile_v1/**"
      - "packages/conclave_cli_worker_runtime/**"
      - "engines/cli_worker/**"
      - "scripts/check-flutter-app.sh"
      - "scripts/build-cli-worker-engine.sh"
      - ".github/workflows/development-profile-lab.yml"
  pull_request:
    paths:
      - "apps/profile_lab/**"
      - "packages/conclave_design/**"
      - "packages/dart/protocol/**"
      - "packages/protocol/**"
      - "packages/conclave_worker_protocol/**"
      - "packages/tool_profile_v1/**"
      - "packages/conclave_cli_worker_runtime/**"
      - "engines/cli_worker/**"
      - "scripts/check-flutter-app.sh"
      - "scripts/build-cli-worker-engine.sh"
      - ".github/workflows/development-profile-lab.yml"

permissions:
  contents: read

concurrency:
  group: dev-profile-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-profile-lab:
    name: Validate Profile Lab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: false
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate Profile Lab
        run: bash scripts/check-flutter-app.sh profile_lab
