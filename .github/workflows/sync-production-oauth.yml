name: Sync production OAuth
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-cloud-deploy
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SYNTILA_AUTH_GITHUB_CLIENT_ID: ${{ secrets.SYNTILA_AUTH_GITHUB_CLIENT_ID || secrets.CONCLAVE_AUTH_GITHUB_CLIENT_ID }}
      SYNTILA_AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.SYNTILA_AUTH_GITHUB_CLIENT_SECRET || secrets.CONCLAVE_AUTH_GITHUB_CLIENT_SECRET }}
      SYNTILA_AUTH_GOOGLE_CLIENT_ID: ${{ secrets.SYNTILA_AUTH_GOOGLE_CLIENT_ID || secrets.CONCLAVE_AUTH_GOOGLE_CLIENT_ID }}
      SYNTILA_AUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.SYNTILA_AUTH_GOOGLE_CLIENT_SECRET || secrets.CONCLAVE_AUTH_GOOGLE_CLIENT_SECRET }}
    steps:
      - name: Prepare OAuth secrets without exposing values
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const names = ['SYNTILA_AUTH_GITHUB_CLIENT_ID', 'SYNTILA_AUTH_GITHUB_CLIENT_SECRET', 'SYNTILA_AUTH_GOOGLE_CLIENT_ID', 'SYNTILA_AUTH_GOOGLE_CLIENT_SECRET'];
          const values = Object.fromEntries(names.map(name => {
            if (!process.env[name]) throw new Error(`Missing OAuth secret: ${name}`);
            return [name, process.env[name]];
          }));
          fs.writeFileSync('oauth-secrets.json', JSON.stringify(values), {mode: 0o600});
          NODE
      - name: Sync OAuth credentials only; preserve application session secret
        run: npx --yes wrangler@4.149.0 secret bulk oauth-secrets.json --name syntila-app
      - name: Verify configured secret names
        run: npx --yes wrangler@4.149.0 secret list --name syntila-app
      - name: Remove temporary secret file
        if: always()
        run: rm -f oauth-secrets.json
