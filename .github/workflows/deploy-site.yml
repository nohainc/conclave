name: Public site

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "apps/site/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/deploy-site.yml"
      - ".github/actions/**"
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/deploy-site.yml"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preview:
    name: Preview deploy
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/check-site
      - name: Deploy temporary Cloudflare preview
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ../../node_modules/.bin/wrangler deploy --config wrangler.jsonc --name "syntila-site-pr-${PR_NUMBER}"

  cleanup-preview:
    name: Delete closed preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Delete preview Worker
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          name="syntila-site-pr-${PR_NUMBER}"
          if npx --yes wrangler@4.149.0 delete "$name" --config wrangler.jsonc --force; then
            echo "Deleted preview Worker $name."
          elif npx --yes wrangler@4.149.0 whoami > /dev/null 2>&1; then
            echo "::notice::No preview Worker named $name exists. It was never deployed or is already removed."
          else
            echo "::error::Cloudflare authentication failed. Preview cleanup did not run." >&2
            exit 1
          fi

  production:
    name: Production deploy
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production-site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: production-site-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/check-site
      - name: Deploy public domains
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ../../node_modules/.bin/wrangler deploy --config wrangler.production.jsonc
