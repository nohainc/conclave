name: Deploy Conclave AX Public Site Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install repository toolchain
        working-directory: .
        run: pnpm install --frozen-lockfile
      - run: ./node_modules/.bin/astro check
      - run: ./node_modules/.bin/astro build
      - name: Deploy temporary Cloudflare preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ../../node_modules/.bin/wrangler deploy --config wrangler.jsonc
