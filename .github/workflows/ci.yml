name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Verify Conclave AX branding invariants, vector purity, and asset synchronization
        run: pnpm brand:check
      - name: Validate v8 architecture, Cloud, protocol, Engine, Workspace, AX, and fixture E2E
        run: pnpm check

  app-flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build web --release --dart-define=CONCLAVE_API_URL=/api

  profile-lab-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Run Profile Lab checks and fixture based Engine acceptance
        run: bash scripts/test-profile-lab-macos.sh
      - name: Build Profile Lab for macOS
        env:
          CONCLAVE_RELEASE_TRUST_KEYS_JSON: ${{ vars.CONCLAVE_RELEASE_TRUST_KEYS_JSON }}
        run: bash scripts/build-profile-lab-macos.sh --release

  site-astro:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: ./node_modules/.bin/astro check
      - run: ./node_modules/.bin/astro build
      - run: node scripts/check-performance.mjs
      - run: node scripts/check-accessibility.mjs
      - run: node scripts/check-responsive.mjs
      - run: node scripts/check-analytics-privacy.mjs
      - run: node scripts/check-security.mjs
      - run: node scripts/check-content.mjs
      - run: node scripts/check-release.mjs
      - run: ./node_modules/.bin/vitest run test
      - name: Verify static routes
        run: |
          test -f dist/index.html
          test -f dist/how-it-works/index.html
          test -f dist/workers/index.html
          test -f dist/security/index.html
          test -f dist/downloads/index.html

  workspace-flutter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/workspace
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Build Conclave Workspace for macOS
        if: runner.os == 'macOS'
        working-directory: .
        env:
          CONCLAVE_WORKSPACE_SKIP_CHECKS: "1"
        run: bash scripts/build-workspace-macos.sh
