name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cloud: ${{ steps.detect.outputs.cloud }}
      dart: ${{ steps.detect.outputs.dart }}
      app: ${{ steps.detect.outputs.app }}
      workspace: ${{ steps.detect.outputs.workspace }}
      profile_lab: ${{ steps.detect.outputs.profile_lab }}
      engine: ${{ steps.detect.outputs.engine }}
      site: ${{ steps.detect.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/detect-changes.sh

  static:
    name: Repository static guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/setup-flutter
      - name: Run static checks
        run: pnpm check:static

  cloud:
    name: Cloud and TypeScript packages
    needs: changes
    if: needs.changes.outputs.cloud == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - name: Type-check and test cloud and packages
        run: pnpm check:typescript

  dart-packages:
    name: Dart packages
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
      - name: Check Dart packages
        run: bash scripts/check-dart-packages.sh

  app:
    name: AX web app
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
      - name: Validate AX web app
        run: bash scripts/check-flutter-app.sh app
      - name: Build web bundle
        working-directory: apps/app
        run: flutter build web --release --dart-define=SYNTILA_API_URL=/api

  workspace:
    name: Workspace
    needs: changes
    if: needs.changes.outputs.workspace == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          install: "false"
      - uses: ./.github/actions/setup-flutter
      - name: Validate Workspace
        run: bash scripts/check-flutter-app.sh workspace

  profile-lab:
    name: Profile Lab
    needs: changes
    if: needs.changes.outputs.profile_lab == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          install: "false"
      - uses: ./.github/actions/setup-flutter
      - name: Validate Profile Lab
        run: bash scripts/check-flutter-app.sh profile_lab

  engine:
    name: Worker engine and runtime packages
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
      - name: Validate Worker engine
        run: bash scripts/validate-engine.sh

  site:
    name: Public site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/check-site

  ci-passed:
    name: CI passed
    if: always()
    needs:
      [
        changes,
        static,
        cloud,
        dart-packages,
        app,
        workspace,
        profile-lab,
        engine,
        site,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed or be skipped by its path filter
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if ! echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' > /dev/null; then
            echo "$NEEDS" | jq .
            exit 1
          fi
          echo "All required CI jobs passed."
