name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: ../../node_modules/.bin/wrangler check startup
        working-directory: apps/worker
      - run: ../../node_modules/.bin/wrangler check startup --config forge-execution.wrangler.jsonc
        working-directory: apps/worker

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  publish-evidence:
    if: ${{ vars.CONCLAVE_CI_INGEST_URL != '' && vars.CONCLAVE_RUN_ID != '' }}
    needs: [typescript, flutter]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Publish machine evidence to Conclave
        env:
          CONCLAVE_CI_INGEST_URL: ${{ vars.CONCLAVE_CI_INGEST_URL }}
          CONCLAVE_RUN_ID: ${{ vars.CONCLAVE_RUN_ID }}
          CONCLAVE_CI_INGEST_TOKEN: ${{ secrets.CONCLAVE_CI_INGEST_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
        run: |
          payload=$(jq -n \
            --arg evidenceId "github-${GITHUB_RUN_ID}" \
            --arg externalRunId "${GITHUB_RUN_ID}" \
            --arg revision "${GITHUB_SHA}" \
            --arg workflow "${GITHUB_WORKFLOW}" \
            --arg observedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              evidenceId: $evidenceId,
              source: "github_actions",
              externalRunId: $externalRunId,
              revision: $revision,
              workflow: $workflow,
              conclusion: "success",
              checks: [
                {name: "TypeScript checks", status: "passed", command: "pnpm check", exitCode: 0, artifactIds: []},
                {name: "Worker startup", status: "passed", command: "wrangler check startup", exitCode: 0, artifactIds: []},
                {name: "Flutter analyze", status: "passed", command: "flutter analyze", exitCode: 0, artifactIds: []},
                {name: "Flutter tests", status: "passed", command: "flutter test", exitCode: 0, artifactIds: []}
              ],
              smokeTests: ["Worker health smoke test"],
              healthChecks: ["Worker startup analysis passed"],
              observedAt: $observedAt
            }')
          curl --fail-with-body --silent --show-error \
            -X POST "${CONCLAVE_CI_INGEST_URL}/api/runs/${CONCLAVE_RUN_ID}/ci-evidence" \
            -H "authorization: Bearer ${CONCLAVE_CI_INGEST_TOKEN}" \
            -H "content-type: application/json" \
            --data "$payload"
