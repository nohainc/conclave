name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high
      - run: pnpm protocol:check
      - run: pnpm docs:check
      - run: pnpm cloud:execution-boundary-check
      - run: pnpm host:architecture-check
      - run: pnpm production:preflight
      - run: pnpm auth:access-guard
      - run: pnpm v4:architecture-guard
      - run: pnpm check
      - run: ../../node_modules/.bin/wrangler check startup
        working-directory: apps/cloud
      - run: ../../node_modules/.bin/wrangler check startup --config forge-execution.wrangler.jsonc
        working-directory: apps/cloud

  app-flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --dart-define=CONCLAVE_API_URL=/api

  site-astro:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: ./node_modules/.bin/astro check
      - run: ./node_modules/.bin/astro build
      - run: node scripts/check-performance.mjs
      - run: ./node_modules/.bin/vitest run test
      - name: Verify static routes
        run: |
          test -f dist/index.html
          test -f dist/how-it-works/index.html
          test -f dist/workers/index.html
          test -f dist/security/index.html

  host-flutter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/host
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Compile native Host
        shell: bash
        run: |
          output_path="$RUNNER_TEMP/conclave-host"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            output_path="$RUNNER_TEMP/conclave-host.exe"
          fi
          dart compile exe bin/conclave_host.dart -o "$output_path"

  publish-evidence:
    if: ${{ vars.CONCLAVE_CI_INGEST_URL != '' && vars.CONCLAVE_RUN_ID != '' }}
    needs: [typescript, app-flutter, site-astro, host-flutter]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Publish machine evidence to Conclave
        env:
          CONCLAVE_CI_INGEST_URL: ${{ vars.CONCLAVE_CI_INGEST_URL }}
          CONCLAVE_RUN_ID: ${{ vars.CONCLAVE_RUN_ID }}
          CONCLAVE_CI_INGEST_TOKEN: ${{ secrets.CONCLAVE_CI_INGEST_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
        run: |
          payload=$(jq -n \
            --arg evidenceId "github-${GITHUB_RUN_ID}" \
            --arg externalRunId "${GITHUB_RUN_ID}" \
            --arg revision "${GITHUB_SHA}" \
            --arg workflow "${GITHUB_WORKFLOW}" \
            --arg observedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              evidenceId: $evidenceId,
              source: "github_actions",
              externalRunId: $externalRunId,
              revision: $revision,
              workflow: $workflow,
              conclusion: "success",
              checks: [
                {name: "TypeScript checks", status: "passed", command: "pnpm check", exitCode: 0, artifactIds: []},
                {name: "Cloudflare startup", status: "passed", command: "wrangler check startup", exitCode: 0, artifactIds: []},
                {name: "Conclave AX App Flutter", status: "passed", command: "flutter analyze && flutter test", exitCode: 0, artifactIds: []},
                {name: "Public Astro Site", status: "passed", command: "astro check && astro build", exitCode: 0, artifactIds: []},
                {name: "Host Dart", status: "passed", command: "dart analyze && dart test", exitCode: 0, artifactIds: []}
              ],
              smokeTests: ["Cloud startup analysis passed"],
              healthChecks: ["Architecture v4 CI checks passed"],
              observedAt: $observedAt
            }')
          curl --fail-with-body --silent --show-error \
            -X POST "${CONCLAVE_CI_INGEST_URL}/api/runs/${CONCLAVE_RUN_ID}/ci-evidence" \
            -H "authorization: Bearer ${CONCLAVE_CI_INGEST_TOKEN}" \
            -H "content-type: application/json" \
            --data "$payload"
