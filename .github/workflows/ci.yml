name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repo-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: false
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:static

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:typescript

  dart-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: false
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-
      - run: bash scripts/check-dart-packages.sh

  app-flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: false
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-
      - run: bash scripts/check-flutter-app.sh app
      - run: flutter build web --release --dart-define=CONCLAVE_API_URL=/api
        working-directory: apps/app

  workspace-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: false
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-
      - run: bash scripts/check-flutter-app.sh workspace

  workspace-macos-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: false
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: flutter pub get
        working-directory: apps/workspace
      - run: bash scripts/build-cli-worker-engine.sh
      - name: Build Workspace using prepared dependencies and Engine
        env:
          CONCLAVE_RELEASE_TRUST_KEYS_JSON: ${{ vars.CONCLAVE_RELEASE_TRUST_KEYS_JSON || '{"conclave-ci":{"local-profile-ci":"dkQtoBOraPG9a/yfGPHEHw0F7TFC+nIbeYzbdPYnXPA="}}' }}
        run: bash scripts/build-workspace-macos.sh --prepared

  profile-lab-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: false
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Profile Lab and fixture Engine acceptance
        run: bash scripts/check-flutter-app.sh profile_lab
      - name: Build Profile Lab using prepared dependencies and Engine
        env:
          CONCLAVE_RELEASE_TRUST_KEYS_JSON: ${{ vars.CONCLAVE_RELEASE_TRUST_KEYS_JSON || '{"conclave-ci":{"local-profile-ci":"dkQtoBOraPG9a/yfGPHEHw0F7TFC+nIbeYzbdPYnXPA="}}' }}
        run: bash scripts/build-profile-lab-macos.sh --release --prepared

  site-astro:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: ./node_modules/.bin/astro check
      - run: ./node_modules/.bin/astro build
      - run: node scripts/check-performance.mjs
      - run: node scripts/check-accessibility.mjs
      - run: node scripts/check-responsive.mjs
      - run: node scripts/check-analytics-privacy.mjs
      - run: node scripts/check-security.mjs
      - run: node scripts/check-content.mjs
      - run: node scripts/check-release.mjs
      - run: ./node_modules/.bin/vitest run test
      - name: Verify static routes
        run: |
          test -f dist/index.html
          test -f dist/how-it-works/index.html
          test -f dist/workers/index.html
          test -f dist/use-cases/index.html
          test -f dist/security/index.html
          test -f dist/downloads/index.html

  acceptance-gate:
    name: Repository Acceptance Gate
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs:
      [
        repo-static,
        typescript,
        dart-core,
        app-flutter,
        workspace-check,
        workspace-macos-build,
        profile-lab-macos,
        site-astro,
      ]
    steps:
      - name: Require every validation domain to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY_GATE'
          import json, os, sys
          jobs = json.loads(os.environ['NEEDS_JSON'])
          failed = {name: job['result'] for name, job in jobs.items() if job['result'] != 'success'}
          if failed:
              print(f"Acceptance failed: {failed}")
              sys.exit(1)
          print("Repository acceptance passed.")
          PY_GATE
