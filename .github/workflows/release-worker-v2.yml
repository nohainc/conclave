name: Release native Dart Workers

on:
  workflow_dispatch:
    inputs:
      worker_version:
        description: Shared immutable version for the ChatGPT and Gemini Workers
        required: true
        type: string
      release_channel:
        description: Worker release channel
        required: true
        default: stable
        type: choice
        options: [stable, beta, development]

permissions:
  contents: read

concurrency:
  group: worker-release-${{ inputs.worker_version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            dart_arch: arm64
          - platform: macos-x64
            runner: macos-15-intel
            dart_arch: x64
          - platform: linux-x64
            runner: ubuntu-24.04
            dart_arch: x64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            dart_arch: arm64
          - platform: windows-x64
            runner: windows-2022
            dart_arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
          architecture: ${{ matrix.dart_arch }}
      - name: Validate release version
        shell: bash
        env:
          WORKER_VERSION: ${{ inputs.worker_version }}
        run: |
          [[ "$WORKER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
      - name: Resolve pinned dependencies
        shell: bash
        run: |
          for package in \
            packages/conclave_worker_protocol \
            packages/conclave_cli_worker_runtime \
            workers/fixture_cli \
            workers/chatgpt \
            workers/gemini; do
            (cd "$package" && dart pub get --enforce-lockfile)
          done
      - name: Analyze and test Worker packages
        shell: bash
        run: |
          for package in \
            packages/conclave_worker_protocol \
            packages/conclave_cli_worker_runtime \
            workers/fixture_cli \
            workers/chatgpt \
            workers/gemini; do
            (cd "$package" && dart analyze && dart test)
          done
      - name: Compile and exercise native Worker executables
        shell: bash
        env:
          WORKER_VERSION: ${{ inputs.worker_version }}
          WORKER_PLATFORM: ${{ matrix.platform }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            RUNNER_TEMP_DIR="$(cygpath -u "$RUNNER_TEMP_DIR")"
          fi
          extension=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then extension=".exe"; fi
          output="$RUNNER_TEMP_DIR/worker-artifacts/$WORKER_PLATFORM"
          mkdir -p "$output/chatgpt" "$output/gemini"
          dart compile exe -DWORKER_VERSION="$WORKER_VERSION" \
            workers/chatgpt/bin/chatgpt_worker.dart \
            -o "$output/chatgpt/conclave-chatgpt-worker$extension"
          dart compile exe -DWORKER_VERSION="$WORKER_VERSION" \
            workers/gemini/bin/gemini_worker.dart \
            -o "$output/gemini/conclave-gemini-worker$extension"
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            chmod 755 "$output/chatgpt/conclave-chatgpt-worker" "$output/gemini/conclave-gemini-worker"
          fi
          (cd packages/conclave_cli_worker_runtime && \
            dart run tool/initialize_harness.dart \
              "$output/chatgpt/conclave-chatgpt-worker$extension" chatgpt "$WORKER_VERSION" && \
            dart run tool/initialize_harness.dart \
              "$output/gemini/conclave-gemini-worker$extension" gemini "$WORKER_VERSION")
      - uses: actions/upload-artifact@v4
        with:
          name: worker-binaries-${{ matrix.platform }}
          path: ${{ runner.temp }}/worker-artifacts
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Sign and publish matching Worker releases
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: worker-binaries-*
          path: ${{ runner.temp }}/worker-artifacts
          merge-multiple: true
      - name: Sign, package, and publish all ten native releases
        env:
          WORKER_VERSION: ${{ inputs.worker_version }}
          WORKER_RELEASE_CHANNEL: ${{ inputs.release_channel }}
          WORKER_ARTIFACT_DIR: ${{ runner.temp }}/worker-artifacts
          CONCLAVE_CLOUD_URL: ${{ vars.CONCLAVE_CLOUD_URL }}
          CONCLAVE_RELEASE_PUBLISH_TOKEN: ${{ secrets.CONCLAVE_RELEASE_PUBLISH_TOKEN }}
          CONCLAVE_WORKER_PUBLISHER: ${{ vars.CONCLAVE_WORKER_PUBLISHER }}
          CONCLAVE_WORKER_SIGNING_KEY_ID: ${{ vars.CONCLAVE_WORKER_SIGNING_KEY_ID }}
          CONCLAVE_WORKER_SIGNING_SEED: ${{ secrets.CONCLAVE_WORKER_SIGNING_SEED }}
        run: node scripts/release/publish-worker-releases.mjs
