name: Development Cloud

on:
  push:
    branches: [main]
    paths:
      - "apps/cloud/**"
      - "packages/core/**"
      - "packages/protocol/**"
      - "packages/security/**"
      - "packages/workspace-runtime-protocol/**"
      - "packages/tool-profile/**"
      - "scripts/verify-cloud-execution-boundary.mjs"
      - "scripts/verify-cloud-schema-references.mjs"
      - "scripts/verify-production-security.mjs"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/development-cloud.yml"
  pull_request:
    paths:
      - "apps/cloud/**"
      - "packages/core/**"
      - "packages/protocol/**"
      - "packages/security/**"
      - "packages/workspace-runtime-protocol/**"
      - "packages/tool-profile/**"
      - "scripts/verify-cloud-execution-boundary.mjs"
      - "scripts/verify-cloud-schema-references.mjs"
      - "scripts/verify-production-security.mjs"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/development-cloud.yml"

permissions:
  contents: read

concurrency:
  group: dev-cloud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-cloud:
    name: Validate Cloud & TypeScript Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate Cloud & Typescript
        run: pnpm check:typescript
