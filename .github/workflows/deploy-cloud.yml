name: Deploy cloud

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-cloud-deploy
  cancel-in-progress: false

jobs:
  require-ci:
    name: Require passing CI on main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/require-ci-success.sh

  deploy:
    name: Deploy app.conclaveax.com
    needs: require-ci
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/setup-flutter

      - name: Build web bundle
        working-directory: apps/app
        run: flutter build web --release --dart-define=CONCLAVE_API_URL=/api

      - name: Verify browser bundle contains no server secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONCLAVE_AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.CONCLAVE_AUTH_GITHUB_CLIENT_SECRET }}
          CONCLAVE_AUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.CONCLAVE_AUTH_GOOGLE_CLIENT_SECRET }}
          CONCLAVE_RELEASE_PUBLISH_TOKEN: ${{ secrets.CONCLAVE_RELEASE_PUBLISH_TOKEN }}
          CONCLAVE_WORKSPACE_ED25519_SEED: ${{ secrets.CONCLAVE_WORKSPACE_ED25519_SEED }}
        run: node scripts/assert-no-browser-secrets.mjs apps/app/build/web

      - name: Verify production security configuration
        run: node scripts/verify-production-security.mjs

      - name: Validate email sender configuration without sending mail
        run: pnpm email:config-check

      - name: Sync Better Auth and OAuth secrets to the Worker
        working-directory: apps/cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CONCLAVE_AUTH_GITHUB_CLIENT_ID: ${{ secrets.CONCLAVE_AUTH_GITHUB_CLIENT_ID }}
          CONCLAVE_AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.CONCLAVE_AUTH_GITHUB_CLIENT_SECRET }}
          CONCLAVE_AUTH_GOOGLE_CLIENT_ID: ${{ secrets.CONCLAVE_AUTH_GOOGLE_CLIENT_ID }}
          CONCLAVE_AUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.CONCLAVE_AUTH_GOOGLE_CLIENT_SECRET }}
        run: bash ../../scripts/ci/sync-worker-secrets.sh ../../infra/cloudflare/app.wrangler.jsonc

      - name: Apply production D1 migrations
        working-directory: apps/cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: CONFIRM_PRODUCTION_MIGRATION=YES ../../scripts/migrate-production-d1.sh

      - name: Verify production D1 schema before Worker deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/production-workspace-gateway-smoke.mjs --schema-only

      - name: Deploy app.conclaveax.com Worker
        working-directory: apps/cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config ../../infra/cloudflare/app.wrangler.jsonc

      - name: Require production desktop-auth and Workspace Gateway acceptance
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: node scripts/production-workspace-gateway-smoke.mjs

      - name: Remove production smoke runtime
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/production-workspace-gateway-smoke.mjs --cleanup-only
