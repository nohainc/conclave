name: Deploy Conclave AX App

on:
  workflow_dispatch:

concurrency:
  group: conclave-ax-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install repository toolchain
        working-directory: .
        run: pnpm install --frozen-lockfile
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Flutter web
        run: flutter build web --release --dart-define=CONCLAVE_API_URL=/api
      - name: Verify browser bundle contains no server secrets
        working-directory: .
        run: node scripts/assert-no-browser-secrets.mjs apps/app/build/web
      - name: Verify production security configuration
        working-directory: .
        run: node scripts/verify-production-security.mjs
      - name: Verify Forge production configuration
        working-directory: .
        run: node scripts/verify-production-security.mjs apps/cloud/forge-execution.wrangler.jsonc
      - name: Apply production D1 migrations
        working-directory: apps/cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply conclave-production --remote --config ../../infra/cloudflare/app.wrangler.jsonc
      - name: Deploy Forge execution service
        working-directory: apps/cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config forge-execution.wrangler.jsonc
      - name: Deploy app.conclaveax.com
        working-directory: apps/cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config ../../infra/cloudflare/app.wrangler.jsonc
