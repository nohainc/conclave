name: Deploy Conclave AX App

on:
  workflow_dispatch:

concurrency:
  group: conclave-ax-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install repository toolchain
        run: pnpm install --frozen-lockfile
      - name: Validate production Gateway smoke script
        run: node --check scripts/production-workspace-gateway-smoke.mjs
      - id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: false
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-
      - name: Validate Cloud contract and TypeScript packages
        run: pnpm validate:cloud && pnpm check:fixture-e2e
      - name: Validate AX Web App
        run: pnpm validate:app
      - name: Build Flutter web
        working-directory: apps/app
        run: flutter build web --release --dart-define=CONCLAVE_API_URL=/api
      - name: Verify browser bundle contains no server secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONCLAVE_AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.CONCLAVE_AUTH_GITHUB_CLIENT_SECRET }}
          CONCLAVE_AUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.CONCLAVE_AUTH_GOOGLE_CLIENT_SECRET }}
          CONCLAVE_RELEASE_PUBLISH_TOKEN: ${{ secrets.CONCLAVE_RELEASE_PUBLISH_TOKEN }}
          CONCLAVE_WORKSPACE_ED25519_SEED: ${{ secrets.CONCLAVE_WORKSPACE_ED25519_SEED }}
        run: node scripts/assert-no-browser-secrets.mjs apps/app/build/web
      - name: Verify production security configuration
        run: node scripts/verify-production-security.mjs
      - name: Preflight production Tool Profile signer and trust root
        env:
          CONCLAVE_RELEASE_PRIVATE_KEY: ${{ secrets.CONCLAVE_RELEASE_PRIVATE_KEY }}
          CONCLAVE_RELEASE_PUBLISHER: ${{ vars.CONCLAVE_RELEASE_PUBLISHER }}
          CONCLAVE_RELEASE_SIGNING_KEY_ID: ${{ vars.CONCLAVE_RELEASE_SIGNING_KEY_ID }}
          CONCLAVE_RELEASE_TRUST_KEYS_JSON: ${{ vars.CONCLAVE_RELEASE_TRUST_KEYS_JSON }}
        run: |
          if [ -z "${CONCLAVE_RELEASE_PRIVATE_KEY:-}" ]; then
            echo "CONCLAVE_RELEASE_PRIVATE_KEY is not configured; skipping production Tool Profile signer preflight (development phase)."
          else
            node scripts/verify-tool-profile-signer.mjs
          fi
      - name: Sync Better Auth provider secrets to Cloudflare Worker
        working-directory: apps/cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CONCLAVE_AUTH_GITHUB_CLIENT_ID: ${{ secrets.CONCLAVE_AUTH_GITHUB_CLIENT_ID }}
          CONCLAVE_AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.CONCLAVE_AUTH_GITHUB_CLIENT_SECRET }}
          CONCLAVE_AUTH_GOOGLE_CLIENT_ID: ${{ secrets.CONCLAVE_AUTH_GOOGLE_CLIENT_ID }}
          CONCLAVE_AUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.CONCLAVE_AUTH_GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for name in \
            BETTER_AUTH_SECRET \
            CONCLAVE_AUTH_GITHUB_CLIENT_ID \
            CONCLAVE_AUTH_GITHUB_CLIENT_SECRET \
            CONCLAVE_AUTH_GOOGLE_CLIENT_ID \
            CONCLAVE_AUTH_GOOGLE_CLIENT_SECRET; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | pnpm exec wrangler secret put "$name" \
                --config ../../infra/cloudflare/app.wrangler.jsonc
            fi
          done
      - name: Sync production Tool Profile signing configuration
        working-directory: apps/cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONCLAVE_RELEASE_PRIVATE_KEY: ${{ secrets.CONCLAVE_RELEASE_PRIVATE_KEY }}
          CONCLAVE_RELEASE_PUBLISHER: ${{ vars.CONCLAVE_RELEASE_PUBLISHER }}
          CONCLAVE_RELEASE_SIGNING_KEY_ID: ${{ vars.CONCLAVE_RELEASE_SIGNING_KEY_ID }}
          CONCLAVE_RELEASE_TRUST_KEYS_JSON: ${{ vars.CONCLAVE_RELEASE_TRUST_KEYS_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${CONCLAVE_RELEASE_PRIVATE_KEY:-}" ]; then
            echo "CONCLAVE_RELEASE_PRIVATE_KEY is not configured; skipping Tool Profile signing sync (development phase)."
            exit 0
          fi
          for name in \
            CONCLAVE_RELEASE_PRIVATE_KEY \
            CONCLAVE_RELEASE_PUBLISHER \
            CONCLAVE_RELEASE_SIGNING_KEY_ID \
            CONCLAVE_RELEASE_TRUST_KEYS_JSON; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "Missing production Profile signer configuration: $name"
              exit 1
            fi
            printf '%s' "$value" | pnpm exec wrangler secret put "$name" \
              --config ../../infra/cloudflare/app.wrangler.jsonc
          done
      - name: Verify Better Auth production secrets
        working-directory: apps/cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONCLAVE_RELEASE_PRIVATE_KEY: ${{ secrets.CONCLAVE_RELEASE_PRIVATE_KEY }}
        run: |
          pnpm exec wrangler secret list --config ../../infra/cloudflare/app.wrangler.jsonc \
            | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => (input += chunk));
              process.stdin.on("end", () => {
                const firstBracket = input.indexOf("[");
                const lastBracket = input.lastIndexOf("]");
                if (firstBracket === -1 || lastBracket === -1 || lastBracket < firstBracket) {
                  console.error("Unable to parse wrangler secret list output as JSON array:\n" + input);
                  process.exit(1);
                }
                const parsed = JSON.parse(input.slice(firstBracket, lastBracket + 1));
                const configured = new Set(parsed.map((secret) => secret.name));
                const required = [
                  "BETTER_AUTH_SECRET",
                ];
                if (process.env.CONCLAVE_RELEASE_PRIVATE_KEY) {
                  required.push(
                    "CONCLAVE_RELEASE_PRIVATE_KEY",
                    "CONCLAVE_RELEASE_PUBLISHER",
                    "CONCLAVE_RELEASE_SIGNING_KEY_ID",
                    "CONCLAVE_RELEASE_TRUST_KEYS_JSON",
                  );
                }
                const missing = required.filter((name) => !configured.has(name));
                if (missing.length > 0) {
                  console.error(`Missing production Worker secrets: ${missing.join(", ")}`);
                  console.error("These must be configured as Cloudflare Worker secrets on conclave-ax-app.");
                  console.error("Add them with: pnpm exec wrangler secret put NAME --config ../../infra/cloudflare/app.wrangler.jsonc");
                  process.exit(1);
                }
              });
            '
      - name: Require Better Auth signing secret for desktop auth smoke
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          if [ -z "${BETTER_AUTH_SECRET:-}" ]; then
            echo "Configure the GitHub Actions secret BETTER_AUTH_SECRET with the same value as the conclave-ax-app Cloudflare Worker secret."
            echo "The production dual desktop-auth smoke uses it to sign a disposable AX browser approval cookie."
            exit 1
          fi
      - name: Apply production D1 migrations
        working-directory: apps/cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: CONFIRM_PRODUCTION_MIGRATION=YES ../../scripts/migrate-production-d1.sh
      - name: Verify production D1 schema before Worker deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/production-workspace-gateway-smoke.mjs --schema-only
      - name: Deploy app.conclaveax.com
        working-directory: apps/cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config ../../infra/cloudflare/app.wrangler.jsonc
      - name: Require production dual desktop-auth and Workspace Gateway acceptance
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: node scripts/production-workspace-gateway-smoke.mjs
      - name: Ensure production smoke runtime is removed
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/production-workspace-gateway-smoke.mjs --cleanup-only
