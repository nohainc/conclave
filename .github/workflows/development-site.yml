name: Development Public Site

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/development-site.yml"
  pull_request:
    paths:
      - "apps/site/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/development-site.yml"

permissions:
  contents: read

concurrency:
  group: dev-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-site:
    name: Validate Public Site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: ./node_modules/.bin/astro check
      - run: ./node_modules/.bin/astro build
      - run: node scripts/check-performance.mjs
      - run: node scripts/check-accessibility.mjs
      - run: node scripts/check-responsive.mjs
      - run: node scripts/check-analytics-privacy.mjs
      - run: node scripts/check-security.mjs
      - run: node scripts/check-content.mjs
      - run: node scripts/check-release.mjs
      - run: ./node_modules/.bin/vitest run test
      - name: Verify static routes
        run: |
          test -f dist/index.html
          test -f dist/how-it-works/index.html
          test -f dist/workers/index.html
          test -f dist/use-cases/index.html
          test -f dist/security/index.html
          test -f dist/downloads/index.html
