name: Release macOS app

on:
  workflow_dispatch:
    inputs:
      product:
        description: Application to release
        type: choice
        options: [workspace, profile-lab]
        required: true
      version:
        description: Immutable release version
        type: string
        required: true
      channel:
        description: Release channel (Workspace only)
        type: choice
        options: [development, beta, stable]
        default: development
      release_notes:
        description: Release notes included in signed metadata
        type: string
        required: false

permissions:
  contents: read

jobs:
  require-ci:
    name: Require passing CI on main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/require-ci-success.sh

  workspace:
    name: Syntila Workspace (signed and notarized)
    needs: require-ci
    if: inputs.product == 'workspace'
    runs-on: macos-15
    environment: workspace-release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-flutter

      - name: Configure Developer ID and notarization
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.CONCLAVE_MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.CONCLAVE_MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.CONCLAVE_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.CONCLAVE_APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.CONCLAVE_APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MACOS_CERTIFICATE_P12" && test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$APPLE_ID" && test -n "$APPLE_TEAM_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/conclave-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          CERT_PATH="$RUNNER_TEMP/conclave-developer-id.p12"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$CERT_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          test -n "$IDENTITY"
          echo "CONCLAVE_MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          xcrun notarytool store-credentials conclave-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --keychain "$KEYCHAIN_PATH"
          echo 'CONCLAVE_MACOS_NOTARY_PROFILE=conclave-notary' >> "$GITHUB_ENV"

      - name: Run Workspace analysis and tests
        run: bash scripts/test-workspace-macos.sh

      - name: Build, sign, and notarize Workspace
        env:
          CONCLAVE_WORKSPACE_VERSION: ${{ inputs.version }}
          CONCLAVE_RELEASE_TRUST_KEYS_JSON: ${{ vars.CONCLAVE_RELEASE_TRUST_KEYS_JSON }}
        run: bash scripts/build-workspace-macos.sh

      - name: Verify notarized app archive
        env:
          WORKSPACE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ARCHIVE="dist/conclave-workspace/macos/Syntila-Workspace-$WORKSPACE_VERSION-macos.zip"
          mkdir -p "$RUNNER_TEMP/workspace-bundle-check"
          ditto -x -k "$ARCHIVE" "$RUNNER_TEMP/workspace-bundle-check"
          BUNDLE="$RUNNER_TEMP/workspace-bundle-check/conclave-workspace"
          bash scripts/verify-workspace-service-bundle.sh "$BUNDLE"
          # Bare executables are not assessable by spctl; require a Developer ID signature.
          codesign -dv --verbose=4 "$BUNDLE/conclave-workspace" 2>&1 | grep -q "Authority=Developer ID Application"
          codesign -dv --verbose=4 "$BUNDLE/assets/engines/conclave-agent" 2>&1 | grep -q "Authority=Developer ID Application"

      - name: Sign, publish, download, and verify immutable metadata
        env:
          WORKSPACE_ARCHIVE: dist/conclave-workspace/macos/Syntila-Workspace-${{ inputs.version }}-macos.zip
          WORKSPACE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          CLOUD_API_URL: ${{ vars.CLOUD_API_URL }}
          RELEASE_PUBLISH_TOKEN: ${{ secrets.CONCLAVE_RELEASE_PUBLISH_TOKEN }}
          CONCLAVE_WORKSPACE_SIGNING_SEED: ${{ secrets.CONCLAVE_WORKSPACE_ED25519_SEED }}
          CONCLAVE_WORKSPACE_SIGNING_KEY_ID: ${{ vars.CONCLAVE_WORKSPACE_SIGNING_KEY_ID }}
          CONCLAVE_RELEASE_TRUST_KEYS_JSON: ${{ vars.CONCLAVE_RELEASE_TRUST_KEYS_JSON }}
        run: node scripts/release/publish-workspace-release.mjs

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "${KEYCHAIN_PATH:-}" 2>/dev/null || true

  profile-lab:
    name: Profile Lab (internal build)
    needs: require-ci
    if: inputs.product == 'profile-lab'
    runs-on: macos-15
    environment: profile-lab-release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/setup-flutter

      - name: Run macOS Profile Lab tests
        run: bash scripts/test-profile-lab-macos.sh

      - name: Build unsigned development Profile Lab
        env:
          PROFILE_LAB_VERSION: ${{ inputs.version }}
        run: |
          bash scripts/build-profile-lab-macos.sh --release --unsigned --version "$PROFILE_LAB_VERSION"

      - name: Verify development app archive
        env:
          PROFILE_LAB_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ARCHIVE="dist/conclave-profile-lab/macos/Syntila-Profile-Lab-$PROFILE_LAB_VERSION-macos.zip"
          mkdir -p "$RUNNER_TEMP/profile-lab-app-check"
          ditto -x -k "$ARCHIVE" "$RUNNER_TEMP/profile-lab-app-check"
          test -d "$RUNNER_TEMP/profile-lab-app-check/Syntila Profile Lab.app"

      - name: Upload internal release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conclave-profile-lab-${{ inputs.version }}-macos
          path: dist/conclave-profile-lab/macos/Syntila-Profile-Lab-${{ inputs.version }}-macos.zip
          retention-days: 90
          if-no-files-found: error
