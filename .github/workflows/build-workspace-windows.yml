name: Build Windows Workspace installer

on:
  workflow_dispatch:

concurrency:
  group: windows-runtime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw 'Inno Setup checksum mismatch.' }
          $compilerDir = Join-Path $env:RUNNER_TEMP 'inno-setup'
          $install = Start-Process $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$compilerDir`"") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Compiler installation failed: $($install.ExitCode)" }
      - name: Build standalone service and generic Engine
        shell: bash
        env:
          # Compile-only trust root; this workflow never publishes a release.
          CONCLAVE_RELEASE_TRUST_KEYS_JSON: ${{ vars.CONCLAVE_RELEASE_TRUST_KEYS_JSON || '{"conclave-ci":{"local-profile-ci":"dkQtoBOraPG9a/yfGPHEHw0F7TFC+nIbeYzbdPYnXPA="}}' }}
        run: bash scripts/build-workspace-service.sh
      - name: Validate Windows runtime primitives and service lifecycle
        shell: pwsh
        working-directory: apps/workspace
        env:
          CONCLAVE_TEST_WINDOWS_SERVICE: ${{ github.workspace }}\dist\conclave-workspace\service\workspace.exe
        run: |
          flutter test test/windows_runtime_test.dart test/windows_service_lifecycle_test.dart test/windows_service_manager_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate Windows process jobs and CLI shims
        shell: pwsh
        working-directory: packages/conclave_cli_worker_runtime
        run: |
          dart pub get
          dart test test/windows_cli_shim_test.dart test/windows_process_job_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and package Windows UI
        shell: pwsh
        env:
          CONCLAVE_RELEASE_TRUST_KEYS_JSON: ${{ vars.CONCLAVE_RELEASE_TRUST_KEYS_JSON || '{"conclave-ci":{"local-profile-ci":"dkQtoBOraPG9a/yfGPHEHw0F7TFC+nIbeYzbdPYnXPA="}}' }}
        run: ./scripts/build-workspace-windows.ps1
      - name: Validate packaged service layout
        shell: pwsh
        working-directory: apps/workspace
        env:
          CONCLAVE_TEST_WINDOWS_SERVICE: ${{ github.workspace }}\dist\conclave-workspace\windows\release\workspace.exe
        run: |
          flutter test test/windows_service_lifecycle_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test packaged UI startup
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD 'dist/conclave-workspace/windows/release'
          $app = Start-Process (Join-Path $bundle 'conclave_workspace.exe') -WorkingDirectory $bundle -PassThru
          try {
            Start-Sleep -Seconds 8
            $app.Refresh()
            if ($app.HasExited) { throw "Packaged UI exited early with code $($app.ExitCode)" }
            Write-Host 'Packaged Windows UI remained running after startup.'
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - name: Build unsigned per-user installer
        shell: pwsh
        run: ./scripts/package-workspace-windows.ps1 -Compiler "$env:RUNNER_TEMP/inno-setup/ISCC.exe"
      - name: Test install, upgrade and uninstall
        shell: pwsh
        run: ./scripts/test-workspace-windows-installer.ps1
      - name: Retain installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conclave-workspace-windows-x64-installer
          path: dist/conclave-workspace/installer/*Setup.exe
          if-no-files-found: error
      - name: Retain preview bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conclave-workspace-windows-x64-preview
          path: dist/conclave-workspace/*-preview.zip
          if-no-files-found: error
