name: Build Linux Workspace

on:
  push:
    branches: ["codex/linux-workspace"]
  workflow_dispatch:

concurrency:
  group: linux-workspace-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Compile-only trust root; this workflow never publishes a release.
      CONCLAVE_RELEASE_TRUST_KEYS_JSON: ${{ vars.CONCLAVE_RELEASE_TRUST_KEYS_JSON || '{"conclave-ci":{"local-profile-ci":"dkQtoBOraPG9a/yfGPHEHw0F7TFC+nIbeYzbdPYnXPA="}}' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb
      - uses: ./.github/actions/setup-flutter
      - name: Validate Linux runtime adapters
        working-directory: apps/workspace
        run: |
          flutter pub get --enforce-lockfile
          flutter test test/linux_runtime_test.dart test/sleep_inhibitor_test.dart test/secure_credentials_test.dart
      - name: Build and package Linux bundle
        run: bash scripts/build-workspace-linux.sh release
      - name: Packaged service one-shot lifecycle
        run: |
          state="$(mktemp -d)"
          CONCLAVE_WORKSPACE_SECRET_STORE=file \
            dist/conclave-workspace/linux/release/conclave-service \
            --data-dir "$state/state" --work-root "$state/work" --once
          test -f "$state/state/installation-id"
      - name: Smoke test packaged UI startup
        run: |
          bundle="$PWD/dist/conclave-workspace/linux/release"
          export HOME="$(mktemp -d)"
          xvfb-run -a "$bundle/conclave_workspace" &
          app=$!
          sleep 10
          if ! kill -0 "$app" 2>/dev/null; then
            wait "$app"; echo "Packaged UI exited early with code $?"; exit 1
          fi
          echo "Packaged Linux UI remained running after startup."
          kill "$app" || true
      - name: Retain bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conclave-workspace-linux-x64
          path: dist/conclave-workspace/*.tar.gz
          if-no-files-found: error
