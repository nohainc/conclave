name: Development Guard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: dev-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-guard:
    name: Repository Fast Static Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: false
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-
      - run: pnpm install --frozen-lockfile
      - name: Run Fast Static Checks
        run: pnpm check:static
