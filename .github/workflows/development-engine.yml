name: Development Worker Engine

on:
  push:
    branches: [main]
    paths:
      - "engines/cli_worker/**"
      - "packages/conclave_worker_protocol/**"
      - "packages/tool_profile_v1/**"
      - "packages/conclave_cli_worker_runtime/**"
      - "scripts/validate-engine.sh"
      - "scripts/build-cli-worker-engine.sh"
      - ".github/workflows/development-engine.yml"
  pull_request:
    paths:
      - "engines/cli_worker/**"
      - "packages/conclave_worker_protocol/**"
      - "packages/tool_profile_v1/**"
      - "packages/conclave_cli_worker_runtime/**"
      - "scripts/validate-engine.sh"
      - "scripts/build-cli-worker-engine.sh"
      - ".github/workflows/development-engine.yml"

permissions:
  contents: read

concurrency:
  group: dev-engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-engine:
    name: Validate Worker Engine & Runtime Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: false
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-
      - name: Validate Worker Engine
        run: bash scripts/validate-engine.sh
