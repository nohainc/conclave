name: Deploy Conclave AX Public Site

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: conclave-ax-public-site-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install repository toolchain
        working-directory: .
        run: pnpm install --frozen-lockfile
      - run: ./node_modules/.bin/astro check
      - run: ./node_modules/.bin/astro build
      - run: node scripts/check-performance.mjs
      - run: node scripts/check-accessibility.mjs
      - run: node scripts/check-responsive.mjs
      - run: node scripts/check-analytics-privacy.mjs
      - run: node scripts/check-security.mjs
      - run: node scripts/check-content.mjs
      - run: node scripts/check-release.mjs
      - run: ./node_modules/.bin/vitest run test
      - name: Verify static routes
        run: |
          test -f dist/index.html
          test -f dist/how-it-works/index.html
          test -f dist/workers/index.html
          test -f dist/use-cases/index.html
          test -f dist/security/index.html
          test -f dist/downloads/index.html
      - name: Deploy public domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ../../node_modules/.bin/wrangler deploy --config wrangler.production.jsonc
