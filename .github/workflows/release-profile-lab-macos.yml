name: Release Conclave Profile Lab for macOS (Internal)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable Profile Lab release version
        type: string
        required: true
      channel:
        description: Release channel
        type: choice
        options: [development, testing, stable]
        default: testing
        required: true
      release_notes:
        description: Internal release notes
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require successful repository CI for this main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Profile Lab releases must be dispatched from main."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100" > "$RUNNER_TEMP/ci-runs.json"
          node --input-type=module - "$RUNNER_TEMP/ci-runs.json" <<'NODE'
          import { readFileSync } from 'node:fs';

          const { workflow_runs: runs = [] } = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const passed = runs.some((run) =>
            run.event === 'push' &&
            run.head_branch === 'main' &&
            run.head_sha === process.env.GITHUB_SHA &&
            run.status === 'completed' &&
            run.conclusion === 'success'
          );
          if (!passed) {
            console.error(`No successful repository CI run exists for ${process.env.GITHUB_SHA} on main.`);
            process.exit(1);
          }
          console.log(`Repository CI passed for ${process.env.GITHUB_SHA}.`);
          NODE

  release:
    needs: ci-gate
    runs-on: macos-15
    environment: profile-lab-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run repository architecture, protocol, and Profile tests
        run: pnpm check
      - name: Run macOS Profile Lab tests
        run: bash scripts/test-profile-lab-macos.sh
      - name: Configure Developer ID and notarization
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.CONCLAVE_MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.CONCLAVE_MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.CONCLAVE_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.CONCLAVE_APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.CONCLAVE_APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [[ -n "$MACOS_CERTIFICATE_P12" && -n "$MACOS_CERTIFICATE_PASSWORD" ]]; then
            KEYCHAIN_PATH="$RUNNER_TEMP/conclave-profile-lab.keychain-db"
            KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            CERT_PATH="$RUNNER_TEMP/conclave-developer-id.p12"
            echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
            security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH"
            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
            if [[ -n "$IDENTITY" ]]; then
              echo "CONCLAVE_MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
            fi
            if [[ -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" ]]; then
              xcrun notarytool store-credentials conclave-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --keychain "$KEYCHAIN_PATH"
              echo 'CONCLAVE_MACOS_NOTARY_PROFILE=conclave-notary' >> "$GITHUB_ENV"
            fi
          fi
      - name: Build, sign, and notarize Profile Lab
        run: |
          bash scripts/build-profile-lab-macos.sh \
            --release \
            --version "${{ inputs.version }}"
      - name: Verify notarized app archive
        env:
          PROFILE_LAB_VERSION: ${{ inputs.version }}
        run: |
          ARCHIVE="dist/conclave-profile-lab/macos/Conclave-Profile-Lab-$PROFILE_LAB_VERSION-macos.zip"
          mkdir -p "$RUNNER_TEMP/profile-lab-app-check"
          ditto -x -k "$ARCHIVE" "$RUNNER_TEMP/profile-lab-app-check"
          APP="$RUNNER_TEMP/profile-lab-app-check/Conclave Profile Lab.app"
          test -d "$APP"
          if [[ -n "${CONCLAVE_MACOS_SIGN_IDENTITY:-}" ]]; then
            codesign --verify --deep --strict --verbose=2 "$APP"
            spctl --assess --type execute --verbose "$APP"
          fi
      - name: Upload internal immutable release artifact
        uses: actions/upload-artifact@v4
        with:
          name: conclave-profile-lab-${{ inputs.version }}-macos
          path: dist/conclave-profile-lab/macos/Conclave-Profile-Lab-${{ inputs.version }}-macos.zip
          retention-days: 90
          if-no-files-found: error
