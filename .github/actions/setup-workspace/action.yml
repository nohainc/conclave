name: Setup workspace
description: Install pnpm and Node, then install repository dependencies with the frozen lockfile.

inputs:
  install:
    description: Run pnpm install --frozen-lockfile at the repository root.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      with:
        version: 11.19.0

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
