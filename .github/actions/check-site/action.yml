name: Check public site
description: Type-check, build, and verify the Astro public site. Run setup-workspace first.

runs:
  using: composite
  steps:
    - name: Astro check
      shell: bash
      working-directory: apps/site
      run: ./node_modules/.bin/astro check

    - name: Astro build
      shell: bash
      working-directory: apps/site
      run: ./node_modules/.bin/astro build

    - name: Site quality gates
      shell: bash
      working-directory: apps/site
      run: |
        set -euo pipefail
        node scripts/check-performance.mjs
        node scripts/check-accessibility.mjs
        node scripts/check-responsive.mjs
        node scripts/check-analytics-privacy.mjs
        node scripts/check-security.mjs
        node scripts/check-content.mjs
        node scripts/check-release.mjs

    - name: Site unit tests
      shell: bash
      working-directory: apps/site
      run: ./node_modules/.bin/vitest run test

    - name: Verify static routes
      shell: bash
      working-directory: apps/site
      run: |
        set -euo pipefail
        for page in index.html how-it-works/index.html workers/index.html use-cases/index.html security/index.html downloads/index.html; do
          test -f "dist/$page"
        done
